<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lehrer Awards</title>
<meta name="description" content="Wähle in jeder Kategorie deine Lehrkraft. Die meisten Stimmen gewinnen.">
<style>
:root{
  --bg:#f6f4ef; --surface:#fff; --ink:#1a1d21; --ink2:#5b6169; --line:#e3dfd5; --soft:#efece4;
  --accent:#b3261e; --accent-ink:#fff; --gold:#a97c1c; --goldbg:#f7eccd; --good:#2f6b4f;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161a;--surface:#1b1e23;--ink:#eeeae1;--ink2:#9aa0a8;--line:#2c3036;--soft:#22262c;--accent:#e5594f;--accent-ink:#14161a;--gold:#e0b44a;--goldbg:#33291229;--good:#6cc19a}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.narrow{max-width:640px;margin:0 auto;padding:0 20px}

/* Kopf */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.2rem;background:none;border:0;padding:0;display:flex;align-items:center;gap:9px}
.brand i{width:10px;height:10px;background:var(--accent);display:block}
nav{display:flex;gap:2px}
nav button{background:none;border:0;padding:8px 12px;color:var(--ink2);font-size:.92rem;border-radius:6px}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:14px 24px;font-weight:600;font-size:1rem;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--ink2);filter:none}
.btn.ghost{background:none;color:var(--ink2);border:0;padding:14px 16px;font-weight:500}
.btn.ghost:hover{color:var(--ink);filter:none}

/* Start */
.hero{padding:48px 0 12px}
.hero h1{font-family:var(--serif);font-size:clamp(2rem,5.5vw,3.1rem);line-height:1.08;letter-spacing:-.6px;margin:0 0 12px;max-width:16ch}
.hero p{color:var(--ink2);margin:0;max-width:50ch}
.cta{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.prog{margin-top:22px;max-width:420px}
.prog .t{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink2);margin-bottom:7px}
.prog .t b{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.h2{font-family:var(--serif);font-size:1.5rem;margin:44px 0 14px}

/* Ergebnis-Karten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:56px}
.cc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;transition:border-color .12s,background .12s}
.cc:hover{border-color:var(--ink2);background:var(--soft)}
.cc .t{min-width:0}
.cc h3{font-family:var(--serif);font-size:1rem;line-height:1.25;margin:0;font-weight:700}
.cc .st{display:block;margin-top:2px;font-size:.8rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .st b{color:var(--ink);font-weight:600}
.cc .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.cc.v .dot{background:var(--good);border-color:var(--good);color:#fff}
.cc.v .dot::after{content:"";width:5px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tag{flex:none;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.lead{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:.9rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lead .who{font-weight:600}
.lead .who small{color:var(--gold);font-weight:700;margin-right:6px;font-size:.72rem;letter-spacing:.06em}
.lead .n{color:var(--ink2);font-size:.82rem;white-space:nowrap}
.lead.none{color:var(--ink2)}

/* ===== Abstimmen (Schritt für Schritt) ===== */
.vhead{position:sticky;top:60px;z-index:10;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps button{flex:1;height:6px;border:0;padding:0;border-radius:3px;background:var(--line);position:relative}
.steps button::after{content:"";position:absolute;inset:-9px 0}
.steps button.d{background:var(--ink2)}
.steps button.c{background:var(--accent)}
.vmeta{display:flex;justify-content:space-between;color:var(--ink2);font-size:.82rem;margin-bottom:4px}
.vhead h1{font-family:var(--serif);font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.1;letter-spacing:-.4px;margin:0 0 4px}
.vhead p{margin:0 0 12px;color:var(--ink2)}
.vs{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:1rem;outline:none}
.vs:focus{border-color:var(--ink2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.vlist{padding:10px 0 120px}
.opt{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:border-color .1s,background .1s}
.opt:hover{border-color:var(--ink2)}
.opt:active{transform:scale(.995)}
.opt .a{font-weight:600}
.opt small{display:block;color:var(--ink2);font-size:.82rem;font-weight:400}
.opt .ck{display:none;color:var(--accent);font-size:.8rem;font-weight:700}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.opt.sel .ck{display:block}
.vbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.vbar .narrow{display:flex;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.vbar .mid{color:var(--ink2);font-size:.85rem;text-align:center;flex:1;padding:0 8px}
.empty{padding:44px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:1.2rem;margin-bottom:4px}

/* Fertig */
.fin{padding:56px 0 40px;text-align:center}
.fin .ring{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);display:grid;place-items:center;margin:0 auto 18px}
.fin h1{font-family:var(--serif);font-size:2.2rem;margin:0 0 8px;letter-spacing:-.4px}
.fin p{color:var(--ink2);margin:0 auto 24px;max-width:42ch}
.fin .cta{justify-content:center}
.skipped{max-width:520px;margin:34px auto 56px;text-align:left}
.skipped h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.skipped button{display:flex;width:100%;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:6px;text-align:left}
.skipped button:hover{border-color:var(--ink2)}
.skipped button span:last-child{color:var(--accent);font-size:.85rem;font-weight:600}

/* Kategorie-Ergebnis */
.back{background:none;border:0;color:var(--ink2);padding:22px 0 6px;font-size:.9rem}
.back:hover{color:var(--ink)}
.ch{padding:10px 0 24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.ch h1{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.5px}
.ch p{margin:0;color:var(--ink2)}
.mine{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:20px;flex-wrap:wrap}
.mine span{color:var(--ink2);font-size:.9rem}
.mine b{font-weight:600}
.mine .a{display:flex;gap:8px;align-items:center}
.mine button.lnk{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:.88rem;padding:8px}
.win{background:var(--goldbg);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:14px;padding:26px;margin-bottom:16px}
.win small{display:block;color:var(--gold);font-weight:700;letter-spacing:.1em;font-size:.75rem;margin-bottom:6px}
.win h2{font-family:var(--serif);font-size:clamp(1.7rem,5vw,2.4rem);margin:0;line-height:1.1}
.win p{margin:6px 0 0;color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:56px}
.rr{display:grid;grid-template-columns:36px 1fr 110px;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr .p{font-family:var(--serif);color:var(--ink2);font-size:1.1rem}
.rr .nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rr .nm em{font-style:normal;font-size:.7rem;font-weight:600;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);padding:2px 8px;border-radius:999px}
.rr .b{height:8px;border-radius:4px;background:var(--soft);margin-top:8px;overflow:hidden}
.rr .b span{display:block;height:100%;background:var(--ink2);border-radius:4px;transition:width .5s}
.rr:first-child .b span{background:var(--gold)}
.rr .v{text-align:right;line-height:1.2}
.rr .v b{font-family:var(--serif);font-size:1.3rem;display:block}
.rr .v span{font-size:.78rem;color:var(--ink2)}

.chips{display:flex;gap:8px;margin:26px 0 16px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:.88rem;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mc{font-size:.92rem;color:var(--ink2)}.mc b{color:var(--ink)}.mc.open{color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:11px 18px;color:var(--ink2);font-weight:500}
.tabs button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.vsearch{position:sticky;top:60px;z-index:8;background:var(--bg);padding:6px 0 10px}
.vlist{padding:2px 0 56px;max-width:640px}
.more{display:flex;gap:10px;flex-wrap:wrap;margin:-30px 0 56px}
@media(max-width:640px){.more .btn{width:100%}}
/* Gewinner */
.wl .r{display:grid;grid-template-columns:1.2fr 1fr 80px;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.wl .r:hover{background:var(--soft)}
.wl .r:last-child{border-bottom:0}
.wl .c{color:var(--ink2);font-size:.9rem}
.wl .w{font-weight:600}
.wl .s{text-align:right;color:var(--ink2);font-size:.85rem}

.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:.92rem;transition:all .25s;z-index:50;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{border-top:1px solid var(--line);padding:24px 0 48px;color:var(--ink2);font-size:.82rem}
.foot button{background:none;border:0;color:var(--ink2);text-decoration:underline;padding:0;font-size:.82rem;margin-right:12px}
body.voting .foot{display:none}

@media(max-width:640px){
  .wrap,.narrow{padding:0 16px}
  .brand span{display:none}
  nav button{padding:8px 9px;font-size:.86rem}
  .ch{grid-template-columns:1fr}
  .rr{grid-template-columns:28px 1fr 74px;padding:13px 14px}
  .wl .r{grid-template-columns:1fr 70px;gap:4px 10px}
  .wl .c{grid-column:1/-1;font-size:.8rem}
  .cta .btn{width:100%}
  .vbar .btn{padding:13px 18px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="home"><i></i>Lehrer Awards</button>
  <nav>
    <button id="n-cats">Kategorien</button>
    <button id="n-win">Gewinner</button>
  </nav>
</div></header>

<main id="app"></main>

<footer class="wrap foot">
  <p>Anonym, ohne Anmeldung. Pro Kategorie zählt eine Stimme pro Gerät, du kannst sie jederzeit ändern.</p>
  <p id="localnote">Offline-Modus: Die Stimmen werden nur in diesem Browser gespeichert.
  <button id="demo">Demo-Stimmen laden</button><button id="reset">Alles zurücksetzen</button></p>
</footer>
<div class="toast" id="toast" role="status"></div>

<script src="lehrer.js"></script>
<script>
const CATS=[
  {id:'erklaerung',n:'Beste Erklärung',q:'Bei wem versteht man den Stoff wirklich?'},
  {id:'lustig',n:'Lustigste Lehrkraft',q:'Bei wem wird am meisten gelacht?'},
  {id:'fair',n:'Fairste Benotung',q:'Wer bewertet nachvollziehbar und gerecht?'},
  {id:'chill',n:'Chillste Lehrkraft',q:'Wer bleibt immer entspannt?'},
  {id:'streng',n:'Strengste Lehrkraft',q:'Bei wem herrscht absolute Ordnung?'},
  {id:'vertrauen',n:'Beste Vertrauensperson',q:'Wem würdest du ein Problem anvertrauen?'},
  {id:'klassenfahrt',n:'Klassenfahrt-Begleitung',q:'Mit wem fährst du am liebsten weg?'},
  {id:'stil',n:'Bestgekleidet',q:'Wer hat den besten Stil?'},
  {id:'laune',n:'Beste Laune',q:'Wer ist selbst montags um 8 gut drauf?'},
  {id:'nerven',n:'Stärkste Nerven',q:'Wer bleibt ruhig, egal was passiert?'},
  {id:'geschichten',n:'Beste Geschichten',q:'Wer schweift am besten vom Thema ab?'},
  {id:'motivation',n:'Größte Motivation',q:'Wer holt auch das Beste aus Unlustigen heraus?'},
  {id:'kaffee',n:'Kaffee-Champion',q:'Wer läuft nie ohne Tasse durchs Haus?'},
  {id:'stimme',n:'Lauteste Stimme',q:'Wer wird auch ohne Mikrofon im ganzen Gang gehört?'},
  {id:'unvergessen',n:'Unvergesslichster Unterricht',q:'Welche Stunde bleibt dir ewig im Kopf?'},
  {id:'ueberraschung',n:'Größte Überraschung',q:'Wer ist netter, als er oder sie wirkt?'}
];
const KT='la_tally_v1', KM='la_mine_v1';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tally=load(KT,{}), mine=load(KM,{});
const T=id=>TEACHERS.find(t=>t.id===id);
const C=id=>CATS.find(c=>c.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const plural=(n,a,b)=>n===1?a:b;
const doneCount=()=>CATS.filter(c=>mine[c.id]).length;
const SORTED=[...TEACHERS].sort((a,b)=>a.n.localeCompare(b.n,'de')||a.v.localeCompare(b.v,'de'));
const CHECK='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function ranking(cid){
  const t=tally[cid]||{};
  const list=Object.keys(t).filter(id=>t[id]>0&&T(id)).map(id=>({t:T(id),n:t[id]}));
  list.sort((a,b)=>b.n-a.n||a.t.n.localeCompare(b.t.n,'de'));
  return {list,total:list.reduce((s,x)=>s+x.n,0)};
}
/* ---------- Server-Anbindung (Fallback: nur lokal, z. B. beim Öffnen per Doppelklick) ---------- */
let apiOn=false, syncedAt=0;
const TOK=(()=>{const gen=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  try{let t=localStorage.getItem('la_token');if(!t||!/^[A-Za-z0-9-]{16,64}$/.test(t)){t=gen();localStorage.setItem('la_token',t)}return t}catch(e){return gen()}})();
async function api(method,body){
  const r=await fetch('/api/votes'+(method==='GET'?'?t='+encodeURIComponent(TOK):''),
    {method,headers:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify({t:TOK,...body})});
  if(!r.ok) throw new Error('api '+r.status);
  return r.json();
}
function applySnap(s){tally=s.tally||{};mine=s.mine||{}}
async function sync(force){
  if(location.protocol==='file:'||(!force&&Date.now()-syncedAt<8000)) return;
  syncedAt=Date.now();
  try{
    applySnap(await api('GET')); apiOn=true; $('localnote').hidden=true;
    if(!/\/vote$/.test(location.hash)) render(true);
  }catch(e){ if(!apiOn) $('localnote').hidden=false }
}
function vote(cid,tid){
  const t=tally[cid]=tally[cid]||{};
  if(mine[cid]===tid) return;
  if(mine[cid]) t[mine[cid]]=Math.max(0,(t[mine[cid]]||0)-1);
  t[tid]=(t[tid]||0)+1; mine[cid]=tid;
  if(!apiOn){save(KT,tally);save(KM,mine);return}
  api('POST',{cat:cid,tid}).then(s=>{applySnap(s);render(true)}).catch(()=>{toast('Stimme konnte nicht gespeichert werden');sync(true)});
}
function unvote(cid){
  if(!mine[cid]) return;
  const t=tally[cid]||{}; t[mine[cid]]=Math.max(0,(t[mine[cid]]||0)-1);
  delete mine[cid];
  if(!apiOn){save(KT,tally);save(KM,mine);return}
  api('DELETE',{cat:cid}).then(s=>{applySnap(s);render(true)}).catch(()=>{toast('Stimme konnte nicht zurückgezogen werden');sync(true)});
}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}
const nextOpenHash=()=>{const c=CATS.find(c=>!mine[c.id]);return c?'#/vote/'+c.id:'#/fertig'};
const nextAfter=i=>{for(let j=i+1;j<CATS.length;j++) if(!mine[CATS[j].id]) return '#/vote/'+CATS[j].id;
  return doneCount()===CATS.length||i>=CATS.length-1?'#/fertig':'#/vote/'+CATS[i+1].id};

/* ---------- Start: Kategorien frei wählen ---------- */
let filterMode='all';
function leadHtml(cid){
  const r=ranking(cid);
  if(!r.list.length) return `<div class="lead none">Noch keine Stimmen.</div>`;
  const top=r.list.filter(x=>x.n===r.list[0].n);
  return `<div class="lead"><span class="who"><small>${top.length>1?'GLEICHSTAND':'FÜHRT'}</small>${top.length>1?top.length+' gleichauf':esc(top[0].t.n)}</span><span class="n">${r.list[0].n} ${plural(r.list[0].n,'Stimme','Stimmen')}</span></div>`;
}
function viewHome(){
  const d=doneCount();
  const shown=CATS.filter(c=>filterMode==='all'||(filterMode==='open'?!mine[c.id]:!!mine[c.id]));
  return `<div class="wrap"><section class="hero">
    <h1>Wer ist die Beste, der Beste, die Lustigste?</h1>
    <p>Such dir die Kategorien aus, bei denen du mitmachen willst. Pro Kategorie eine Stimme, die meisten Stimmen gewinnen. Anonym und ohne Anmeldung.</p>
    <div class="prog"><div class="t"><span>Deine Stimmen</span><span><b>${d}</b> von ${CATS.length} Kategorien</span></div><div class="bar"><span style="width:${Math.round(d/CATS.length*100)}%"></span></div></div>
  </section>
  <div class="chips">${[['all','Alle'],['open','Noch offen'],['done','Abgestimmt']].map(([k,l])=>`<button class="chip ${filterMode===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
  <div class="grid">${shown.length?shown.map(c=>{const my=mine[c.id]&&T(mine[c.id]);return `
    <button class="cc ${my?'v':''}" data-go="#/k/${c.id}" title="${esc(c.q)}">
      <span class="t"><h3>${c.n}</h3><span class="st">${my?`Deine Wahl: <b>${esc(my.n)}</b>`:'Noch offen'}</span></span>
      <span class="dot"></span></button>`}).join(''):`<div class="empty" style="grid-column:1/-1"><b>Nichts hier.</b>In dieser Ansicht gibt es keine Kategorien.</div>`}</div></div>`;
}

/* ---------- Kategorie: Abstimmen / Ergebnis ---------- */
let ctx={cid:null};
function optHtml(cid,q){
  q=q.trim().toLowerCase();
  const l=SORTED.filter(t=>(t.n+' '+t.v+' '+t.k).toLowerCase().includes(q));
  return l.length?l.map(t=>`<button class="opt ${mine[cid]===t.id?'sel':''}" data-t="${t.id}"><span class="a">${esc(t.n)}<small>${esc(t.v)} · ${esc(t.k)}</small></span><span class="ck">Deine Wahl</span></button>`).join('')
    :'<div class="empty"><b>Keine Treffer</b>Prüfe die Schreibweise oder suche nach dem Kürzel.</div>';
}
function resultHtml(cid){
  const r=ranking(cid), my=mine[cid]&&T(mine[cid]);
  const top=r.list.filter(x=>x.n===(r.list[0]||{}).n), max=r.list.length?r.list[0].n:1;
  const nextOpen=CATS.find(c=>!mine[c.id]&&c.id!==cid);
  const winner=!r.list.length?'':top.length>1
    ?`<div class="win"><small>GLEICHSTAND</small><h2>${top.map(x=>esc(x.t.n)).join(' und ')}</h2><p>je ${top[0].n} ${plural(top[0].n,'Stimme','Stimmen')}</p></div>`
    :`<div class="win"><small>AKTUELLER GEWINNER</small><h2>${esc(top[0].t.v)} ${esc(top[0].t.n)}</h2><p>${top[0].n} von ${r.total} ${plural(r.total,'Stimme','Stimmen')} (${Math.round(top[0].n/r.total*100)} %)</p></div>`;
  return (my?`<div class="mine"><span>Deine Stimme: <b>${esc(my.v)} ${esc(my.n)}</b></span><div class="a"><button class="btn sec" data-go="#/k/${cid}/vote">Ändern</button><button class="lnk" data-unvote="${cid}">Zurückziehen</button></div></div>`
    :`<div class="mine"><span>Du hast hier noch nicht abgestimmt.</span><button class="btn" data-go="#/k/${cid}/vote">Jetzt abstimmen</button></div>`)
  +winner+`<div class="panel">${r.list.length?r.list.slice(0,10).map((x,i)=>`
    <div class="rr"><div class="p">${i+1}</div>
      <div><div class="nm">${esc(x.t.v)} ${esc(x.t.n)}${mine[cid]===x.t.id?'<em>Deine Wahl</em>':''}</div><div class="b"><span style="width:${x.n/max*100}%"></span></div></div>
      <div class="v"><b>${x.n}</b><span>${Math.round(x.n/r.total*100)} %</span></div></div>`).join('')
    :`<div class="empty"><b>Noch keine Stimmen</b>Gib die erste Stimme in dieser Kategorie ab.</div>`}</div>
  <div class="more"><button class="btn sec" data-go="#/">Alle Kategorien</button>${nextOpen?`<button class="btn" data-go="#/k/${nextOpen.id}">Nächste offene: ${nextOpen.n} →</button>`:''}</div>`;
}
function viewCat(cid,tab){
  const c=C(cid); if(!c) return '<div class="wrap"><div class="empty">Kategorie nicht gefunden.</div></div>';
  ctx={cid}; tab=tab||(mine[cid]?'result':'vote');
  return `<div class="wrap"><button class="back" data-go="#/">← Alle Kategorien</button>
    <div class="ch"><div><h1>${c.n}</h1><p>${c.q}</p></div></div>
    <div class="tabs"><button class="${tab==='vote'?'on':''}" data-go="#/k/${cid}/vote">Abstimmen</button><button class="${tab==='result'?'on':''}" data-go="#/k/${cid}/result">Ergebnis</button></div>
    ${tab==='vote'?`<div class="vsearch"><input class="vs" id="vq" type="search" placeholder="Lehrkraft suchen (Name oder Kürzel)" autocomplete="off" aria-label="Lehrkraft suchen"></div>
      <div class="vlist" id="vl">${optHtml(cid,'')}</div>`:resultHtml(cid)}</div>`;
}
function viewWin(){
  return `<div class="wrap"><section class="hero" style="padding-bottom:0"><h1>Alle Gewinner</h1><p>Der aktuelle Sieger jeder Kategorie auf einen Blick.</p></section>
  <div class="panel wl" style="margin-top:24px">${CATS.map(c=>{
    const r=ranking(c.id), top=r.list.filter(x=>x.n===(r.list[0]||{}).n);
    const w=!r.list.length?'<span style="color:var(--ink2);font-weight:400">Noch offen</span>':top.length>1?`${top.length} gleichauf`:esc(top[0].t.v+' '+top[0].t.n);
    return `<div class="r" data-go="#/k/${c.id}/result"><div class="c">${c.n}</div><div class="w">${w}</div><div class="s">${r.list.length?r.list[0].n+' '+plural(r.list[0].n,'Stimme','Stimmen'):''}</div></div>`}).join('')}</div></div>`;
}

/* ---------- Router ---------- */
function render(keep){
  const h=location.hash||'#/', mk=h.match(/^#\/k\/(\w+)(?:\/(vote|result))?$/);
  $('n-cats').className=(h==='#/'||!!mk)?'on':''; $('n-win').className=h==='#/gewinner'?'on':'';
  $('app').innerHTML=mk?viewCat(mk[1],mk[2]):h==='#/gewinner'?viewWin():viewHome();
  if(!keep) window.scrollTo(0,0);
}
$('app').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(t){const x=T(t.dataset.t);vote(ctx.cid,x.id);toast(`Stimme für ${x.n} gespeichert`);
    document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===t));
    setTimeout(()=>{location.hash='#/k/'+ctx.cid+'/result'},300);return}
  const f=e.target.closest('[data-f]'); if(f){filterMode=f.dataset.f;render(true);return}
  const g=e.target.closest('[data-go]'); if(g){location.hash=g.dataset.go;return}
  const u=e.target.closest('[data-unvote]'); if(u){unvote(u.dataset.unvote);toast('Stimme zurückgezogen');render(true)}
});
$('app').addEventListener('input',e=>{if(e.target.id==='vq')$('vl').innerHTML=optHtml(ctx.cid,e.target.value)});
$('app').addEventListener('keydown',e=>{
  if(e.target.id==='vq'&&e.key==='Enter'){const f=$('vl').querySelector('[data-t]');if(f)f.click()}
});
$('home').onclick=()=>location.hash='#/';
$('n-cats').onclick=()=>location.hash='#/';
$('n-win').onclick=()=>location.hash='#/gewinner';
$('demo').onclick=()=>{
  if(apiOn) return;
  tally={}; const pool=TEACHERS.map(t=>t.id);
  CATS.forEach(c=>{tally[c.id]={};const fav=[0,1,2,3,4,5].map(()=>pool[Math.floor(Math.random()*pool.length)]);
    for(let i=0;i<60;i++){const id=Math.random()<.7?fav[Math.floor(Math.pow(Math.random(),2)*fav.length)]:pool[Math.floor(Math.random()*pool.length)];tally[c.id][id]=(tally[c.id][id]||0)+1}});
  mine={}; save(KT,tally); save(KM,mine); toast('Demo-Stimmen geladen (nur lokal)'); render(true);
};
$('reset').onclick=()=>{if(!apiOn&&confirm('Alle Stimmen in diesem Browser löschen?')){tally={};mine={};save(KT,tally);save(KM,mine);render(true)}};
addEventListener('hashchange',()=>{render();sync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
render();sync(true);
</script>
</body>
</html>
